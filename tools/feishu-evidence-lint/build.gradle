plugins {
  id 'java-library'
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  compileOnly 'com.android.tools.lint:lint-api:31.11.0'
  compileOnly 'com.android.tools.lint:lint-checks:31.11.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'com.android.tools.lint:lint-api:31.11.0'
  testImplementation 'com.android.tools.lint:lint-checks:31.11.0'
  testImplementation 'com.android.tools.lint:lint-tests:31.11.0'
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

jar {
  manifest {
    attributes('Lint-Registry-v2': 'com.laoji.evidence.lint.FeishuEvidenceIssueRegistry')
  }
}
