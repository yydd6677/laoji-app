name: Mobile CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck -- --incremental false

      - name: Jest and critical coverage thresholds
        run: npm run test:coverage

      - name: Python helper tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Expo dependency compatibility
        run: npx expo-doctor
        env:
          APP_ENV: preview
          EXPO_ALLOW_CLEARTEXT: "false"
          EXPO_PUBLIC_LAOJI_API_BASE: https://api.laoji.example.com
          EXPO_PUBLIC_MEETING_API_BASE: https://meetings.laoji.example.com
          EXPO_PUBLIC_REALTIME_ASR_HOST: realtime.laoji.example.com
          EXPO_PUBLIC_REALTIME_ASR_PORT: "443"
          EXPO_PUBLIC_REALTIME_ASR_PROVIDER: qwen
          EXPO_PUBLIC_REALTIME_ASR_SECURE: "true"
          EXPO_PUBLIC_PRIVACY_POLICY_URL: https://www.laoji.example.com/privacy
          EXPO_PUBLIC_TERMS_OF_SERVICE_URL: https://www.laoji.example.com/terms
          EXPO_PUBLIC_ACCOUNT_DELETION_URL: https://www.laoji.example.com/account-deletion

      - name: Android release configuration
        run: npm run verify:release-config

      - name: Production dependency audit
        run: npm run audit:dependencies

      - name: Public repository boundary
        run: node scripts/check_publication_boundary.js

      - name: Credential scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
